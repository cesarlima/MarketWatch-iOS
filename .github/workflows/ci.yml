name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Cache Pods
        uses: actions/cache@v6
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}

      - name: Install Pods
        run: pod install

      # The runner mounts simulator runtimes on demand; waiting for the device avoids an empty destination list.
      - name: Boot simulator
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-26-5"
          DEVICE="iPhone 17"

          xcrun simctl list runtimes

          for attempt in 1 2 3 4 5 6; do
            UDID=$(xcrun simctl list devices available --json \
              | jq -r --arg runtime "$RUNTIME" --arg device "$DEVICE" \
                '.devices[$runtime][]? | select(.name == $device) | .udid' \
              | head -n 1)
            if [ -n "$UDID" ]; then
              break
            fi
            echo "Simulator not available yet (attempt $attempt of 6), waiting 10s"
            sleep 10
          done

          if [ -z "$UDID" ]; then
            echo "::error::$DEVICE ($RUNTIME) not found"
            xcrun simctl list devices available
            exit 1
          fi

          xcrun simctl bootstatus "$UDID" -b
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace MarketWatch.xcworkspace \
            -scheme MarketWatch \
            -destination "id=$SIMULATOR_UDID" \
            -quiet
